<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BTC 极速大屏悬浮窗</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{text-align:center;padding:40px 16px}
.container{max-width:420px;margin:auto}
h2{margin-bottom:10px;font-size:22px}
button{padding:16px 24px;font-size:17px;font-weight:700;border:0;background:#007aff;color:#fff;border-radius:12px;margin-top:10px;cursor:pointer;}
button:active{transform:scale(0.95);opacity:0.8;}
#status{margin:18px 0 0;color:#8e8e93;font-size:13px;line-height:1.5}
video{display:block;width:320px;height:160px;margin:25px auto 0;background:#000;border:1px solid #222;border-radius:12px}
canvas{display:none}
</style>
</head>
<body>
<div class="container">
<h2>实时行情 & 60分钟合约视图</h2>
<p id="status">正在建立连接…</p>
<button id="pipBtn">⚡ 开启悬浮窗</button>
<canvas id="canvas" width="640" height="320"></canvas>
<video id="video" width="320" height="160" autoplay playsinline></video>
</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");
const btn=document.getElementById("pipBtn");
const status=document.getElementById("status");

let btcPrice="加载中...";
let displayPriceStr="..."; 
let priceColor="#007aff";
let lastPrice=0;
let btcChangeRate="--%"; 
let changeColor="#8e8e93";

let candles = [];
const MAX_CANDLES = 60; 

let ws=null;
let pingTimer=null;
let reconnectTimer=null;

// 控制无缝对齐的开关
let hasAligned = false;

let isDrawing = false;
function scheduleDraw() {
  if (!isDrawing) {
    isDrawing = true;
    requestAnimationFrame(() => {
      drawCanvas();
      isDrawing = false;
    });
  }
}

function formatPrice(num) {
  return parseFloat(num).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

// 借用不限制跨域的币安接口拉取历史走势形状
async function initKlines() {
  try {
    const res = await fetch('https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1m&limit=60');
    if (!res.ok) throw new Error("API 响应失败");
    const data = await res.json();
    candles = data.map(k => ({
      t: Math.floor(k[0] / 60000), 
      o: parseFloat(k[1]),
      h: parseFloat(k[2]),
      l: parseFloat(k[3]),
      c: parseFloat(k[4])
    }));
    scheduleDraw();
  } catch (e1) {
    window.klineError = "代理未覆盖 API";
    scheduleDraw();
  }
}
initKlines();

function drawCanvas(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#1c1c1e";
  ctx.lineWidth=6;
  ctx.strokeRect(3,3,canvas.width-6,canvas.height-6);

  ctx.fillStyle=priceColor;
  ctx.font="bold 76px -apple-system, Arial";
  ctx.textAlign="left";
  ctx.fillText("₮" + displayPriceStr, 20, 90);
  
  ctx.fillStyle=changeColor;
  ctx.font="bold 42px -apple-system, Arial";
  ctx.textAlign="right";
  ctx.fillText(btcChangeRate, canvas.width - 20, 85);

  const now = new Date();
  let secondsLeft = 60 - now.getSeconds();
  if (secondsLeft === 60) secondsLeft = 0;
  const cdStr = secondsLeft < 10 ? "0" + secondsLeft : secondsLeft;

  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(20, 115);
  ctx.lineTo(canvas.width - 20, 115);
  ctx.stroke();

  if (candles.length > 0) {
    const boxX = 20, boxY = 130, boxW = 600, boxH = 170;
    
    let minL = Infinity, maxH = -Infinity;
    for (let i = 0; i < candles.length; i++) {
      if (candles[i].h > maxH) maxH = candles[i].h;
      if (candles[i].l < minL) minL = candles[i].l;
    }

    let yRange = maxH - minL;
    if (yRange === 0) yRange = maxH * 0.001; 
    const padding = yRange * 0.1;
    const drawMax = maxH + padding;
    const drawMin = minL - padding;
    const scale = boxH / (drawMax - drawMin);

    const candleSpace = boxW / MAX_CANDLES;
    const bodyW = Math.max(candleSpace * 0.65, 2); 
    const startIdx = MAX_CANDLES - candles.length;

    for (let i = 0; i < candles.length; i++) {
      const c = candles[i];
      const x = boxX + (startIdx + i) * candleSpace + (candleSpace - bodyW) / 2;

      const yHigh = boxY + (drawMax - c.h) * scale;
      const yLow = boxY + (drawMax - c.l) * scale;
      const yOpen = boxY + (drawMax - c.o) * scale;
      const yClose = boxY + (drawMax - c.c) * scale;

      ctx.fillStyle = c.c >= c.o ? "#34c759" : "#ff3b30";
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(x + bodyW / 2, yHigh);
      ctx.lineTo(x + bodyW / 2, yLow);
      ctx.stroke();

      const bodyY = Math.min(yOpen, yClose);
      const bodyH = Math.max(Math.abs(yOpen - yClose), 2); 
      ctx.fillRect(x, bodyY, bodyW, bodyH);
    }

    const lastCandle = candles[candles.length - 1];
    const isUp = lastCandle.c >= lastCandle.o;
    const trackColor = isUp ? "#34c759" : "#ff3b30";
    const trackBgColor = isUp ? "rgba(52, 199, 89, 0.15)" : "rgba(255, 59, 48, 0.15)";
    
    const lastY = boxY + (drawMax - lastCandle.c) * scale;

    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = trackColor;
    ctx.beginPath();
    ctx.moveTo(boxX, lastY);
    ctx.lineTo(boxX + boxW, lastY);
    ctx.stroke();
    ctx.setLineDash([]); 

    const cdText = "00:" + cdStr;
    ctx.font = "bold 15px -apple-system, Arial";
    const textW = ctx.measureText(cdText).width;
    
    ctx.fillStyle = trackBgColor;
    ctx.fillRect(boxX, lastY - 11, textW + 10, 22);
    ctx.fillStyle = trackColor;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText(cdText, boxX + 5, lastY);
    ctx.textBaseline = "alphabetic"; 

    const maxY = boxY + (drawMax - maxH) * scale;
    const minY = boxY + (drawMax - minL) * scale;

    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#ff6666";
    ctx.beginPath();
    ctx.moveTo(boxX, maxY);
    ctx.lineTo(boxX + boxW, maxY);
    ctx.stroke();

    ctx.strokeStyle = "#4dff4d";
    ctx.beginPath();
    ctx.moveTo(boxX, minY);
    ctx.lineTo(boxX + boxW, minY);
    ctx.stroke();
    ctx.setLineDash([]); 

    ctx.font = "16px -apple-system, Arial";
    ctx.textAlign = "right";
    ctx.fillStyle = "#ff6666";
    ctx.fillText("高 " + maxH.toFixed(1), boxX + boxW - 5, maxY - 8);
    ctx.fillStyle = "#4dff4d";
    ctx.fillText("低 " + minL.toFixed(1), boxX + boxW - 5, minY + 20);

  } else {
    ctx.textAlign="center";
    if (window.klineError) {
      ctx.fillStyle="#ff3b30";
      ctx.font="22px -apple-system, Arial";
      ctx.fillText("失败: " + window.klineError, canvas.width/2, 190);
      ctx.fillStyle="#8e8e93";
      ctx.font="18px -apple-system, Arial";
      ctx.fillText("等待实时推送以生成新 K 线...", canvas.width/2, 235);
    } else {
      ctx.fillStyle="#8e8e93";
      ctx.font="22px -apple-system, Arial";
      ctx.fillText("历史数据拉取中...", canvas.width/2, 210);
    }
  }
}

function startStream(){
  if(!canvas.captureStream) return false;
  try{
    video.srcObject=canvas.captureStream(60); 
    video.muted = true;
    return true;
  }catch(e){
    return false;
  }
}

function stopPing(){
  if(pingTimer){clearInterval(pingTimer);pingTimer=null;}
}

function updateInstantPrice(p) {
  if(!Number.isFinite(p)) return;

  // 【核心黑科技：价格整体偏移缝合】
  // 当拿到第一笔 MEXC 实时价格时，强行修正之前拉取的所有历史 K 线
  if (!hasAligned && candles.length > 0) {
    const lastHistoryClose = candles[candles.length - 1].c;
    const priceOffset = p - lastHistoryClose;
    
    // 把前面 60 根历史 K 线整体平移，与当前 MEXC 价格完美对接
    for(let i=0; i<candles.length; i++){
      candles[i].o += priceOffset;
      candles[i].h += priceOffset;
      candles[i].l += priceOffset;
      candles[i].c += priceOffset;
    }
    hasAligned = true;
  }

  if(lastPrice && p === lastPrice) return; 

  if(lastPrice && p !== lastPrice){
    priceColor = p > lastPrice ? "#34c759" : "#ff3b30";
  }
  btcPrice = p;
  displayPriceStr = formatPrice(p);
  lastPrice = p;
  
  const currentMinute = Math.floor(Date.now() / 60000);
  if (candles.length > 0) {
    let lastCandle = candles[candles.length - 1];
    if (currentMinute === lastCandle.t) {
      lastCandle.c = p;
      if (p > lastCandle.h) lastCandle.h = p;
      if (p < lastCandle.l) lastCandle.l = p;
    } else if (currentMinute > lastCandle.t) {
      candles.push({ t: currentMinute, o: p, h: p, l: p, c: p });
      if (candles.length > MAX_CANDLES) candles.shift(); 
    }
  } else {
    candles.push({ t: currentMinute, o: p, h: p, l: p, c: p });
  }
  
  scheduleDraw();
}

function connectMEXC(forceKill = false){
  if(ws) {
    if(!forceKill && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING)) return;
    ws.close();
    ws = null;
  }

  status.textContent="正在接入高速节点…";
  ws=new WebSocket("wss://contract.mexc.com/edge");

  ws.onopen=()=>{
    status.textContent="已连接，双轨数据窃听中…";
    ws.send(JSON.stringify({ method:"sub.ticker", param:{symbol:"BTC_USDT"} }));
    ws.send(JSON.stringify({ method:"sub.deal", param:{symbol:"BTC_USDT"} }));

    stopPing();
    pingTimer=setInterval(()=>{
      if(ws && ws.readyState===WebSocket.OPEN){
        ws.send(JSON.stringify({method:"ping"}));
      }
    },15000);
  };

  ws.onmessage=(event)=>{
    try{
      const res=JSON.parse(event.data);
      
      if(res.channel==="push.ticker" && res.symbol==="BTC_USDT" && res.data){
        if(res.data.riseFallRate !== undefined) {
          const rate = parseFloat(res.data.riseFallRate);
          if (Number.isFinite(rate)) {
            const percentStr = (rate * 100).toFixed(2) + "%";
            if (rate > 0) { btcChangeRate = "+" + percentStr; changeColor = "#34c759"; } 
            else if (rate < 0) { btcChangeRate = percentStr; changeColor = "#ff3b30"; } 
            else { btcChangeRate = "0.00%"; changeColor = "#8e8e93"; }
          }
        }
        if(res.data.lastPrice) updateInstantPrice(parseFloat(res.data.lastPrice));
      }

      if(res.channel==="push.deal" && res.symbol==="BTC_USDT" && res.data){
        let p = null;
        if(Array.isArray(res.data) && res.data.length > 0) {
          p = parseFloat(res.data[0].p); 
        } else if (res.data.p) {
          p = parseFloat(res.data.p);
        }
        if(p !== null) {
          updateInstantPrice(p);
          status.textContent="🟢 极速数据刷新中";
        }
      }
    }catch(e){}
  };

  ws.onerror=()=>{
    status.textContent="连接异常，准备极速重连…";
  };

  ws.onclose=()=>{
    stopPing();
    status.textContent="连接断开，正在极速重连…";
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(connectMEXC, 500);
  };
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (video.paused) video.play().catch(()=>{});
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
      status.textContent = "屏幕唤醒，极速重连中...";
      connectMEXC(true);
    }
    scheduleDraw();
  }
});

window.addEventListener("focus", () => {
  if (video.paused) video.play().catch(()=>{});
});

setInterval(scheduleDraw, 1000);

const streamOK=startStream();
if(!streamOK){
  btn.disabled=true;
}else{
  connectMEXC();
}

btn.addEventListener("click", () => {
  try {
    if (!window.audioHackApplied) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      
      const destination = audioCtx.createMediaStreamDestination();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      gainNode.gain.value = 0; 
      
      oscillator.connect(gainNode);
      gainNode.connect(destination);
      oscillator.start();

      const audioTrack = destination.stream.getAudioTracks()[0];
      if (audioTrack && video.srcObject) {
        video.srcObject.addTrack(audioTrack);
      }
      
      video.muted = false; 
      audioCtx.resume();
      window.audioHackApplied = true;
    }

    if (video.requestPictureInPicture) {
      video.requestPictureInPicture().catch(error => {
         alert("开启悬浮窗失败：" + error.message);
      });
    } else if (video.webkitSetPresentationMode) {
      video.webkitSetPresentationMode("picture-in-picture");
    }
  } catch (error) {
    alert("执行出错：" + error.message);
  }
});
</script>
</body>
</html>
