<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<!-- 终极优化 1：PWA 原生化标签 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC 盯盘">
<!-- 桌面图标 (提取自开源的比特币 Logo) -->
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/256px-Bitcoin.svg.png">
<title>BTC 极清 K 线悬浮窗</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; overflow:hidden; /* 禁用回弹效果 */}
body{text-align:center;padding:env(safe-area-inset-top, 40px) 16px 40px;}
.container{max-width:420px;margin:auto}
h2{margin-bottom:10px;font-size:22px}
button{padding:16px 24px;font-size:17px;font-weight:700;border:0;background:#007aff;color:#fff;border-radius:12px;margin-top:10px;cursor:pointer;}
#status{margin:18px 0 0;color:#8e8e93;font-size:13px;line-height:1.5}
video{display:block;width:320px;height:160px;margin:25px auto 0;background:#000;border:1px solid #222;border-radius:12px;cursor:pointer;}
canvas{display:none}
</style>
</head>
<body>
<div class="container">
<h2>实时行情 & 60分钟合约视图</h2>
<p id="status">正在建立连接…</p>
<button id="pipBtn">⚡ 开启悬浮窗</button>
<canvas id="canvas"></canvas>
<video id="video" autoplay playsinline></video>
</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");
const btn=document.getElementById("pipBtn");
const status=document.getElementById("status");

const dpr = window.devicePixelRatio || 2;
const logicalWidth = 640;
const logicalHeight = 320;
canvas.width = logicalWidth * dpr;
canvas.height = logicalHeight * dpr;
ctx.scale(dpr, dpr);

let btcPrice="加载中...";
let priceColor="#007aff";
let lastPrice=0;
let btcChangeRate="--%"; 
let changeColor="#8e8e93";

let candles = [];
const MAX_CANDLES = 60; 

let ws=null;
let pingTimer=null;
let reconnectTimer=null;
let lastDrawTime=0; 
let wakeLock=null;

async function initKlines() {
  try {
    const res = await fetch('https://api.mexc.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=60');
    if (!res.ok) throw new Error("API 响应失败");
    const data = await res.json();
    candles = data.map(k => ({
      t: Math.floor(k[0] / 60000), 
      o: parseFloat(k[1]),
      h: parseFloat(k[2]),
      l: parseFloat(k[3]),
      c: parseFloat(k[4])
    }));
    drawCanvas();
  } catch (e) {
    window.klineError = "历史数据加载失败";
    drawCanvas();
  }
}
initKlines();

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {}
}
requestWakeLock();

function throttleDraw() {
  const now = Date.now();
  if (now - lastDrawTime > 200) { 
    drawCanvas();
    lastDrawTime = now;
  }
}

function drawCanvas(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,logicalWidth,logicalHeight);

  ctx.strokeStyle="#1c1c1e";
  ctx.lineWidth=6;
  ctx.strokeRect(3,3,logicalWidth-6,logicalHeight-6);

  ctx.fillStyle=priceColor;
  ctx.font="bold 56px -apple-system, Arial";
  ctx.textAlign="left";
  ctx.fillText("₮" + btcPrice, 25, 80);
  
  ctx.fillStyle=changeColor;
  ctx.font="bold 38px -apple-system, Arial";
  ctx.textAlign="right";
  ctx.fillText(btcChangeRate, logicalWidth - 25, 75);

  const now = new Date();
  let secondsLeft = 60 - now.getSeconds();
  if (secondsLeft === 60) secondsLeft = 0;
  const cdStr = secondsLeft < 10 ? "0" + secondsLeft : secondsLeft;
  
  ctx.fillStyle = "#8e8e93";
  ctx.font = "22px -apple-system, Arial";
  ctx.textAlign = "center";
  ctx.fillText("换线 00:" + cdStr, logicalWidth / 2, 75);

  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(20, 105);
  ctx.lineTo(logicalWidth - 20, 105);
  ctx.stroke();

  if (candles.length > 0) {
    const boxX = 20, boxY = 120, boxW = 600, boxH = 180;
    
    let minL = Infinity, maxH = -Infinity;
    for (let i = 0; i < candles.length; i++) {
      if (candles[i].h > maxH) maxH = candles[i].h;
      if (candles[i].l < minL) minL = candles[i].l;
    }

    let yRange = maxH - minL;
    if (yRange === 0) yRange = maxH * 0.001; 
    const padding = yRange * 0.1;
    const drawMax = maxH + padding;
    const drawMin = minL - padding;
    const scale = boxH / (drawMax - drawMin);

    const candleSpace = boxW / MAX_CANDLES;
    const bodyW = Math.max(candleSpace * 0.65, 2); 
    const startIdx = MAX_CANDLES - candles.length;

    for (let i = 0; i < candles.length; i++) {
      const c = candles[i];
      const x = boxX + (startIdx + i) * candleSpace + (candleSpace - bodyW) / 2;

      const yHigh = boxY + (drawMax - c.h) * scale;
      const yLow = boxY + (drawMax - c.l) * scale;
      const yOpen = boxY + (drawMax - c.o) * scale;
      const yClose = boxY + (drawMax - c.c) * scale;

      ctx.fillStyle = c.c >= c.o ? "#34c759" : "#ff3b30";
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(x + bodyW / 2, yHigh);
      ctx.lineTo(x + bodyW / 2, yLow);
      ctx.stroke();

      const bodyY = Math.min(yOpen, yClose);
      const bodyH = Math.max(Math.abs(yOpen - yClose), 2); 
      ctx.fillRect(x, bodyY, bodyW, bodyH);
    }

    const maxY = boxY + (drawMax - maxH) * scale;
    const minY = boxY + (drawMax - minL) * scale;

    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;

    ctx.strokeStyle = "#ff6666";
    ctx.beginPath();
    ctx.moveTo(boxX, maxY);
    ctx.lineTo(boxX + boxW, maxY);
    ctx.stroke();

    ctx.strokeStyle = "#4dff4d";
    ctx.beginPath();
    ctx.moveTo(boxX, minY);
    ctx.lineTo(boxX + boxW, minY);
    ctx.stroke();
    
    ctx.setLineDash([]); 

    ctx.font = "16px -apple-system, Arial";
    ctx.textAlign = "right";
    ctx.fillStyle = "#ff6666";
    ctx.fillText("高 " + maxH.toFixed(1), boxX + boxW - 5, maxY - 8);
    ctx.fillStyle = "#4dff4d";
    ctx.fillText("低 " + minL.toFixed(1), boxX + boxW - 5, minY + 20);

  } else {
    ctx.textAlign="center";
    if (window.klineError) {
      ctx.fillStyle="#ff3b30";
      ctx.font="22px -apple-system, Arial";
      ctx.fillText("失败: " + window.klineError, logicalWidth/2, 190);
      ctx.fillStyle="#8e8e93";
      ctx.font="18px -apple-system, Arial";
      ctx.fillText("等待 MEXC 实时推送以生成 K 线...", logicalWidth/2, 235);
    } else {
      ctx.fillStyle="#8e8e93";
      ctx.font="22px -apple-system, Arial";
      ctx.fillText("正在拉取 MEXC 历史数据...", logicalWidth/2, 210);
    }
  }
}

function startStream(){
  if(!canvas.captureStream){
    status.textContent="当前浏览器不支持 Canvas 视频流";
    return false;
  }
  try{
    video.srcObject=canvas.captureStream(30);
    video.muted = true;
    return true;
  }catch(e){
    return false;
  }
}

function stopPing(){
  if(pingTimer){clearInterval(pingTimer);pingTimer=null;}
}

// 增加 forceKill 参数，用于在网络切换时强杀僵尸连接
function connectMEXC(forceKill = false){
  if(ws) {
    if(!forceKill && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING)) return;
    ws.close();
    ws = null;
  }

  status.textContent="正在连接抹茶 (MEXC) 高速节点…";
  ws=new WebSocket("wss://contract.mexc.com/edge");

  ws.onopen=()=>{
    status.textContent="已连接，等待 MEXC 推送…";
    ws.send(JSON.stringify({
      method:"sub.ticker",
      param:{symbol:"BTC_USDT"}
    }));

    stopPing();
    pingTimer=setInterval(()=>{
      if(ws && ws.readyState===WebSocket.OPEN){
        ws.send(JSON.stringify({method:"ping"}));
      }
    },15000);
  };

  ws.onmessage=(event)=>{
    try{
      const res=JSON.parse(event.data);
      if(res.channel==="push.ticker" && res.symbol==="BTC_USDT" && res.data){
        
        const p=parseFloat(res.data.lastPrice);
        if(!Number.isFinite(p)) return;

        if(lastPrice && p !== lastPrice){
          if(p>lastPrice) priceColor="#34c759";
          else if(p<lastPrice) priceColor="#ff3b30";
        }
        btcPrice=p.toFixed(1);
        lastPrice=p;
        
        const currentMinute = Math.floor(Date.now() / 60000);
        if (candles.length > 0) {
          let lastCandle = candles[candles.length - 1];
          if (currentMinute === lastCandle.t) {
            lastCandle.c = p;
            if (p > lastCandle.h) lastCandle.h = p;
            if (p < lastCandle.l) lastCandle.l = p;
          } else if (currentMinute > lastCandle.t) {
            candles.push({ t: currentMinute, o: p, h: p, l: p, c: p });
            if (candles.length > MAX_CANDLES) candles.shift(); 
          }
        } else {
          candles.push({ t: currentMinute, o: p, h: p, l: p, c: p });
        }

        if(res.data.riseFallRate !== undefined) {
          const rate = parseFloat(res.data.riseFallRate);
          if (Number.isFinite(rate)) {
            const percentStr = (rate * 100).toFixed(2) + "%";
            if (rate > 0) {
              btcChangeRate = "+" + percentStr;
              changeColor = "#34c759";
            } else if (rate < 0) {
              btcChangeRate = percentStr;
              changeColor = "#ff3b30";
            } else {
              btcChangeRate = "0.00%";
              changeColor = "#8e8e93";
            }
          }
        }
        status.textContent="🟢 抹茶 (MEXC) 极速模式已开启";
        throttleDraw(); 
      }
    }catch(e){}
  };

  ws.onerror=()=>{
    status.textContent="网络波动，极速重连中…";
  };

  ws.onclose=()=>{
    stopPing();
    status.textContent="连接断开，极速重连中…";
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(connectMEXC, 500);
  };
}

// 终极优化 2：监听底层基站/Wi-Fi网络切换，强杀僵尸连接
window.addEventListener('online', () => {
  status.textContent = "网络已恢复，正在强行重连...";
  connectMEXC(true); 
});
window.addEventListener('offline', () => {
  status.textContent = "网络已断开，请检查代理或 Wi-Fi...";
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    requestWakeLock();
    if (video.paused) video.play().catch(()=>{});
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
      status.textContent = "唤醒中，正在极速重连...";
      connectMEXC();
    }
    drawCanvas();
  }
});

window.addEventListener("focus", () => {
  if (video.paused) video.play().catch(()=>{});
});

setInterval(drawCanvas, 1000);
drawCanvas();

const streamOK=startStream();
if(!streamOK){
  btn.disabled=true;
}else{
  connectMEXC();
}

function triggerPiP() {
  try {
    requestWakeLock();
    if (!window.audioHackApplied) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      const destination = audioCtx.createMediaStreamDestination();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      gainNode.gain.value = 0; 
      
      oscillator.connect(gainNode);
      gainNode.connect(destination);
      oscillator.start();

      const audioTrack = destination.stream.getAudioTracks()[0];
      if (audioTrack && video.srcObject) {
        video.srcObject.addTrack(audioTrack);
      }
      
      video.muted = false;
      audioCtx.resume();
      window.audioHackApplied = true;
    }

    if (video.requestPictureInPicture) {
      video.requestPictureInPicture().catch(e => {});
    } else if (video.webkitSetPresentationMode) {
      video.webkitSetPresentationMode("picture-in-picture");
    }
  } catch (error) {}
}

btn.addEventListener("click", triggerPiP);
video.addEventListener("click", triggerPiP);

</script>
</body>
</html>
